name: kristal
description: Kristal — Flutter ilə yazılmış 8x8 blok tapmacası. Tam offline, reklamsız.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#1A1B3A"
  adaptive_icon_foreground: "icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
